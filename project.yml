# XcodeGen の定義。.xcodeproj は生成物なのでコミットしない（`xcodegen generate` で作る）。
name: FocusBlur
options:
  bundleIdPrefix: com.sammy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 8R9WYLJ73B
    CODE_SIGN_STYLE: Automatic
targets:
  FocusBlur:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Views
      - Processing
      - Utilities
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: フォーカスぼかし
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: 編集した動画を写真ライブラリに保存するために使用します
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sammy.focusblur
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FocusBlurTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: FocusBlur
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sammy.focusblur.tests
schemes:
  FocusBlur:
    build:
      targets:
        FocusBlur: all
    test:
      targets:
        - FocusBlurTests
